[package]
name = "npd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://github.com/d-e-s-o/npd"
repository = "https://github.com/d-e-s-o/npd.git"
categories = [
  "accessibility",
  "api-bindings",
  "command-line-utilities",
  "multimedia::audio",
]
keywords = [
  "dbus",
  "desktop",
  "linux",
  "mpd",
  "notification",
]
description = """
Now Playing Daemon is a daemon showing notifications about songs played
by MPD.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
incremental = false
panic = "abort"

[build-dependencies]
grev = { version = "0.2", default-features = false }

[dependencies]
anyhow = { version = "1.0.71", default-features = false, features = ["std"] }
clap = { version = "4.1.4", default-features = false, features = ["derive", "help", "std", "suggestions", "usage"] }
dirs = { version = "7.0", default-features = false }
inotify = {version = "0.11", default-features = false }
zbus = { version = "5.5", default-features = false, features = ["blocking-api", "tokio"] }

[lints.rust]
deprecated_safe = "warn"
future_incompatible = "warn"
keyword_idents = "warn"
let_underscore = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused = "warn"

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
diverging_sub_expression = "allow"
let_and_return = "allow"
let_unit_value = "allow"
module_inception = "allow"
type_complexity = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
doc_markdown = "warn"
join_absolute_paths = "warn"
large_enum_variant = "warn"
multiple_unsafe_ops_per_block = "warn"
redundant_closure_for_method_calls = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
use_self = "warn"
wildcard_imports = "warn"
